[project]
name = "rit-utils"
version = "0.1.0"
description = "Утилиты для помощи в работе"
authors = [{ name = "Maxim Subbotin", email = "pro.shanti@yandex.ru" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "fastapi>=0.116.1,<0.117.0",
    "uvicorn>=0.35.0,<0.36.0",
    "python-multipart>=0.0.20,<0.0.21",
    "python-dotenv>=1.1.1,<2.0.0",
    "authx>=1.4.3,<2.0.0",
    "jinja2>=3.1.6,<4.0.0",
    "pyotp>=2.9.0,<3.0.0",
    "qrcode>=7.4.2,<8.0.0",
    "Pillow>=10.1.0,<11.0.0",
    "python-pptx>=0.6.23,<0.7.0",
    "opencv-python>=4.8.0,<5.0.0",
]

# System dependencies required (install separately):
# LibreOffice для конвертации PPTX в PDF
# Ubuntu/Debian: sudo apt-get install libreoffice
# CentOS/RHEL: sudo yum install libreoffice
# macOS: brew install --cask libreoffice
# Windows: Download from https://www.libreoffice.org/

[dependency-groups]
dev = [
    "black>=26.5.1,<27.0.0",
    "mypy>=2.3.1,<3.0.0",
    "ruff>=0.16.9,<0.17.0",
    "types-pillow>=10.2.0,<11.0.0",
    "types-qrcode>=8.2.0.20250506,<9.0.0.0",
    "pytest>=8.4.1,<9.0.0",
    "pytest-asyncio>=1.1.0,<2.0.0",
    "pytest-mock>=3.14.1,<4.0.0",
    "httpx>=0.28.1,<0.29.0",
]

[tool.uv]
package = false
default-groups = ["dev"]
required-version = ">=0.12.19"

[tool.black]
line-length = 129
target-version = ["py313"]

[tool.ruff]
line-length = 129
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
files = ["src", "tests"]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# python-pptx 0.6.x не содержит аннотаций типов или py.typed.
module = ["pptx", "pptx.*"]
ignore_missing_imports = true
