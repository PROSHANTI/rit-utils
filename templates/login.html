<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIT-UTILS - Вход</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="/static/css/style_login.css?v=password-1">
    <link rel="stylesheet" href="/static/css/hover_shine.css?v=shine-1">
    <script src="/static/login.js?v=password-1" defer></script>
    {% include "ambient_background_head.html" %}
</head>
<body>
    {% include "ambient_background.html" %}
    <div class="login-container">
        <div class="logo">
            <span>RIT-UTILS</span>
        </div>
        <form action="/login" method="post">
            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" autocomplete="current-password" maxlength="1024" required{% if retry_after %} disabled{% endif %}>
                {% if error %}
                <p class="error-message" role="alert">{{ error }}{% if retry_after %} <span id="login-cooldown" data-seconds="{{ retry_after }}" aria-live="off">{{ retry_display }}</span>{% endif %}</p>
                {% endif %}
            </div>
            <button type="submit" class="hover-shine"{% if retry_after %} disabled{% endif %}>Войти</button>
        </form>
    </div>
</body>
</html>
